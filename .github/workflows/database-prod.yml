name: Database Deploy - Production

on:
  push:
    branches:
      - main
    paths:
      - 'Database/**'
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Deploy to Production Database (Neon PROD)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL Client Driver
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Deploy Clean Schema (No Seed Data)
        env:
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import psycopg2

          db_url = os.environ.get('DATABASE_URL_PROD') or os.environ.get('DATABASE_URL_FALLBACK')
          if not db_url:
              print("::error::No se encontró DATABASE_URL_PROD en GitHub Secrets.")
              sys.exit(1)

          print("🛡️ Conectando a Neon PostgreSQL (Ambiente PRODUCCIÓN - Rama production)...")
          try:
              conn = psycopg2.connect(db_url)
              conn.autocommit = True
              cur = conn.cursor()
              print("✅ Conexión establecida exitosamente.")
          except Exception as e:
              print(f"::error::Error al conectar a la base de datos de producción: {e}")
              sys.exit(1)

          # 1. Aplicar Esquema DDL únicamente
          schema_path = 'Database/schema.sql'
          if os.path.exists(schema_path):
              print(f"📄 Aplicando estructura DDL desde {schema_path}...")
              with open(schema_path, 'r', encoding='utf-8') as f:
                  schema_sql = f.read()
              try:
                  cur.execute(schema_sql)
                  print("✅ Esquema DDL aplicado con éxito (tablas, enums, triggers e índices).")
              except Exception as e:
                  print(f"::error::Error ejecutando {schema_path}: {e}")
                  sys.exit(1)

          # 2. Seguridad: En producción NO se inyecta seed.sql
          print("🛡️ REGLA DE SEGURIDAD DE PRODUCCIÓN:")
          print("🛡️ Se omite seed.sql. La base de datos de producción permanece limpia y sin datos ficticios.")

          # 3. Smoke Test de verificación
          print("🔍 Verificando estructura de tablas en PRODUCCIÓN...")
          tables = ['users', 'technicians', 'clients', 'work_orders', 'sim_cards', 'equipment', 'magic_links']
          results = {}
          for table in tables:
              cur.execute(f"SELECT COUNT(*) FROM {table};")
              count = cur.fetchone()[0]
              results[table] = count
              print(f"   • {table}: {count} registros")

          # Resumen en GitHub
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_file:
              with open(summary_file, 'a', encoding='utf-8') as f:
                  f.write("## 🚀 Despliegue en PRODUCCIÓN (Neon PROD)\n\n")
                  f.write("Esquema aplicado de forma limpia y segura (sin datos de prueba).\n\n")
                  f.write("| Tabla | Registros Existentes | Estado |\n")
                  f.write("| :--- | :---: | :---: |\n")
                  for t, c in results.items():
                      f.write(f"| `{t}` | {c} | ✅ Verificada |\n")

          cur.close()
          conn.close()
          print("🎉 Despliegue en PRODUCCIÓN finalizado con éxito.")
          EOF
